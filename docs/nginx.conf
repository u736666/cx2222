# ==============================================================================
# Nginx server block snippet for static Astro hosting
# ==============================================================================

server {
    listen 80;
    server_name example.com; # Replace with your real domain
    root /var/www/cx2222/dist;
    index index.html;

    # Trailing slash handling
    rewrite ^/(.*)/$ /$1 permanent;

    # Clean URLs and 404 routing
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static assets long caching
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML must-revalidate
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
}
